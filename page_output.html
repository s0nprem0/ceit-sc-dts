
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEIT-SC Office Duty Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ceit-primary: #BF6013;
            --ceit-secondary: #F4A441;
            --ceit-accent: #F4A441;
            --ceit-dark: #1C1C1C;
            --ceit-light: #FFFFFF;
            --gradient-primary: linear-gradient(135deg, #BF6013 0%, #F4A441 100%);
            --gradient-secondary: linear-gradient(135deg, #1C1C1C 0%, #2E2E2E 100%);
            --gradient-success: linear-gradient(135deg, #BF6013 0%, #F4A441 100%);
            --gradient-warning: linear-gradient(135deg, #F4A441 0%, #BF6013 100%);
            --gradient-danger: linear-gradient(135deg, #1C1C1C 0%, #2E2E2E 100%);
            --gradient-dark: linear-gradient(135deg, #1C1C1C 0%, #2E2E2E 100%);
            --shadow-soft: 0 4px 15px rgba(0,0,0,0.1);
            --shadow-medium: 0 6px 20px rgba(0,0,0,0.15);
            --shadow-strong: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1C1C1C 0%, #2E2E2E 50%, #BF6013 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: white !important;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .navbar-brand:hover {
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 25px;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card-header {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 1.5rem;
            border-radius: 25px 25px 0 0 !important;
            position: relative;
            overflow: hidden;
        }
        
        .card-body {
            padding: 2rem;
        }
        
        .stats-card {
            background: var(--gradient-secondary);
            color: white;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .stats-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            transform: translate(30px, -30px);
        }
        
        .stats-number {
            font-size: 3rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .form-control {
            border: 2px solid rgba(191, 96, 19, 0.1);
            border-radius: 15px;
            padding: 12px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-control:focus {
            border-color: var(--ceit-primary);
            box-shadow: 0 0 0 0.25rem rgba(191, 96, 19, 0.15);
            background: white;
        }
        
        .form-select {
            border: 2px solid rgba(191, 96, 19, 0.1);
            border-radius: 15px;
            padding: 12px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-select:focus {
            border-color: var(--ceit-primary);
            box-shadow: 0 0 0 0.25rem rgba(191, 96, 19, 0.15);
            background: white;
        }
        
        .btn {
            border: none;
            border-radius: 15px;
            padding: 12px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 8px 25px rgba(191, 96, 19, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(191, 96, 19, 0.4);
            background: var(--gradient-primary);
        }
        
        .btn-success {
            background: var(--gradient-success);
            color: white;
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(191, 96, 19, 0.4);
            background: var(--gradient-success);
        }
        
        .btn-warning {
            background: var(--gradient-warning);
            color: white;
            box-shadow: 0 8px 25px rgba(244, 164, 65, 0.3);
        }
        
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 164, 65, 0.4);
            background: var(--gradient-warning);
        }
        
        .btn-danger {
            background: var(--gradient-danger);
            color: white;
            box-shadow: 0 8px 25px rgba(28, 28, 28, 0.3);
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(28, 28, 28, 0.4);
            background: var(--gradient-danger);
        }
        
        .btn-light {
            background: rgba(255, 255, 255, 0.9);
            color: var(--ceit-dark);
            backdrop-filter: blur(10px);
        }
        
        .btn-light:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .status-badge:hover {
            transform: scale(1.02);
        }
        
        .status-ongoing {
            background: var(--gradient-success);
            color: white;
        }
        
        .status-onbreak {
            background: var(--gradient-warning);
            color: white;
        }
        
        .status-completed {
            background: var(--gradient-dark);
            color: white;
        }
        
        .table {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            background: white;
        }
        
        .table thead th {
            background: var(--gradient-dark);
            color: white;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1.2rem 1rem;
        }
        
        .table tbody tr {
            transition: all 0.3s ease;
        }
        
        .table tbody tr:hover {
            background: linear-gradient(90deg, rgba(191, 96, 19, 0.05), rgba(244, 164, 65, 0.05));
        }
        
        .table tbody td {
            padding: 1rem;
            border-color: rgba(0,0,0,0.05);
            vertical-align: middle;
        }
        
        .alert {
            border: none;
            border-radius: 15px;
            padding: 1.2rem 1.5rem;
            font-weight: 500;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }
        
        .alert::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: currentColor;
        }
        
        .alert-success {
            background: linear-gradient(135deg, rgba(191, 96, 19, 0.1), rgba(244, 164, 65, 0.1));
            color: #BF6013;
            border-left: 4px solid #BF6013;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, rgba(28, 28, 28, 0.1), rgba(46, 46, 46, 0.1));
            color: #1C1C1C;
            border-left: 4px solid #1C1C1C;
        }
        
        .floating-action {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            border: none;
            box-shadow: 0 10px 30px rgba(191, 96, 19, 0.4);
            font-size: 1.5rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        
        .floating-action:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(191, 96, 19, 0.6);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 10px;
        }
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-clock fa-4x mb-3"></i>
                        <div class="stats-number">0</div>
                        <h5 class="mb-0">Active Duties</h5>
                        <small class="opacity-75">Currently On Duty</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Left Column -->
            <div class="col-lg-3 mb-4">
                <!-- Create Account Card -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>
                            Create Officer Account
                        </h5>
                    </div>
                    <div class="card-body">
                        <form method="POST" id="registerForm">
                            <input type="hidden" name="action" value="register">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-user me-1"></i> Full Name *
                                </label>
                                <input type="text" class="form-control" name="full_name" required 
                                       placeholder="Enter full name">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-id-card me-1"></i> Student Number *
                                </label>
                                <input type="text" class="form-control" name="student_number" required 
                                       placeholder="e.g., 202202748">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-users me-1"></i> Committee *
                                </label>
                                <select class="form-select" name="committee" required>
                                    <option value="">Select Committee</option>
                                    <option value="Internal Affairs">Internal Affairs</option>
                                    <option value="External Affairs">External Affairs</option>
                                    <option value="Records and Documentation">Records and Documentation</option>
                                    <option value="Finance and Budget Management">Finance and Budget Management</option>
                                    <option value="Audit Planning and Risk Assessment">Audit Planning and Risk Assessment</option>
                                    <option value="Operations and Implementation">Operations and Implementation</option>
                                    <option value="Public Relations">Public Relations</option>
                                    <option value="Business Affairs and Procurement">Business Affairs and Procurement</option>
                                    <option value="Social and Environmental Awareness">Social and Environmental Awareness</option>
                                    <option value="Sports, Culture, and the Arts">Sports, Culture, and the Arts</option>
                                    <option value="Student Rights and Welfare">Student Rights and Welfare</option>
                                    <option value="Others">Others</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-crown me-1"></i> Position *
                                </label>
                                <select class="form-select" name="position" required>
                                    <option value="">Select Position</option>
                                    <option value="Chairperson">Chairperson</option>
                                    <option value="Vice Chairperson">Vice Chairperson</option>
                                    <option value="Secretary General">Secretary General</option>
                                    <option value="Assistant Secretary General">Assistant Secretary General</option>
                                    <option value="AMBUSH">AMBUSH</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-graduation-cap me-1"></i> Course, Year, and Section *
                                </label>
                                <input type="text" class="form-control" name="course_year_section" required 
                                       placeholder="e.g., BSCS 4-1">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-calendar me-1"></i> Age *
                                </label>
                                <input type="number" class="form-control" name="age" min="16" max="50" required 
                                       placeholder="Enter age">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-phone me-1"></i> Contact Number
                                </label>
                                <input type="text" class="form-control" name="contact_number" 
                                       placeholder="e.g., 09123456789">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-map-marker-alt me-1"></i> Address
                                </label>
                                <textarea class="form-control" name="address" rows="3" 
                                          placeholder="Enter complete address"></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-user-plus me-2"></i>
                                Create Account
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Log In for Duty Card -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Log In for Duty
                        </h5>
                    </div>
                    <div class="card-body">
                        <form method="POST" id="loginForm">
                            <input type="hidden" name="action" value="log_in">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-id-card me-1"></i> Student Number *
                                </label>
                                <input type="text" class="form-control" name="student_number" required 
                                       placeholder="Enter your student number">
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-clock me-2"></i>
                                Start Duty
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-9">
                <!-- Real-time Duty Tracker -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>
                            Real-time Duty Tracker
                        </h5>
                        <button class="btn btn-light btn-sm" onclick="location.reload()">
                            <i class="fas fa-sync-alt me-1"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                                                    <div class="empty-state">
                                <i class="fas fa-clipboard-list"></i>
                                <h5 class="text-muted">No Active Duties Today</h5>
                                <p class="text-muted mb-0">Officers will appear here when they log in for duty.</p>
                            </div>
                                            </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="floating-action" onclick="location.reload()" title="Refresh Data">
        <i class="fas fa-sync-alt"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-refresh the page every 30 seconds
        let refreshInterval = setInterval(function() {
            if (!document.querySelector('.modal.show')) {
                location.reload();
            }
        }, 30000);

        // Form validation and enhancement
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<span class="loading-spinner me-2"></span>Creating Account...';
            submitBtn.disabled = true;
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<span class="loading-spinner me-2"></span>Logging In...';
            submitBtn.disabled = true;
        });

        // Add smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Add intersection observer for animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe all cards
        document.querySelectorAll('.card').forEach(card => {
            observer.observe(card);
        });

        // Add click effects
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);

                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;

                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;

                setTimeout(() => {
                    ripple.remove();
                }, 300);
            });
        });

        // Enhanced form interactions
        document.querySelectorAll('.form-control, .form-select').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });

            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
